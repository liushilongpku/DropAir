name: Windows Smoke Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-app:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installers
        run: |
          npm run tauri -- build --bundles nsis,msi --verbose 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DropAir-windows-build-log
          path: windows-build.log
          if-no-files-found: warn

      - name: Expose Windows build errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path windows-build.log) {
            $lines = Get-Content windows-build.log
            $start = [Math]::Max(0, $lines.Count - 80)
            for ($index = $start; $index -lt $lines.Count; $index++) {
              $message = $lines[$index].Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error file=windows-build.log,line=$($index + 1)::$message"
            }
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: DropAir-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
