name: macOS Smoke Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Build macOS .app
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri macOS app bundle
        run: npm run tauri -- build --bundles app

      - name: Zip macOS app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/DropAir.app" "DropAir.app.zip"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropAir.app.zip
          path: DropAir.app.zip
          if-no-files-found: error
